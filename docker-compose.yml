services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Default: Host=db;Database=hotel;Username=hotel;Password=${POSTGRES_PASSWORD:-hotel}
      Admin__Email: ${ADMIN_EMAIL:-admin@hotel.local}
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      Hotel__PublicApiUrl: ${PUBLIC_URL:-http://localhost:8080}
    volumes: [keys:/keys]

volumes:
  pgdata:
  keys:
